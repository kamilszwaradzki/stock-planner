[project]
name = "stock-planner"
version = "0.1.0"
description = "Demand forecasting and replenishment planning API (FastAPI, pandas, NumPy, DuckDB)"
readme = "README.md"
authors = [
    { name = "Kamil Szwaradzki", email = "kamil.szwaradzki@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb==1.4.1",
    "fastapi>=0.165.0",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
exclude = [".venv"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
